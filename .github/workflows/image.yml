name: Build and push image

# Every push to main produces ghcr.io/tenequm/memegen-rs:sha-<commit>. Nothing
# here deploys: production pins an image by digest outside this repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # tenequm/memegen-rs

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # The template corpus is not committed to the repo. Assemble it into
      # ./templates here (your VLM markup pipeline) before the image build.
      # - run: ./scripts/assemble-templates.sh

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to GHCR
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./ops/docker/Containerfile
          platforms: linux/amd64 # the cluster's nodes
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
