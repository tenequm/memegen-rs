name: Release

# Push a tag like v0.1.0 -> build & push the versioned image to GHCR, then
# cut a GitHub Release whose notes are generated by git-cliff (pond-style) with
# a link to the GHCR image package.
on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # tenequm/memegen-rs

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags for git-cliff

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push versioned image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
          PKG_URL: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}
        run: |
          git-cliff --latest --strip header --config cliff.toml -o NOTES.md
          {
            echo ""
            echo "### 📦 Container image"
            echo ""
            echo '```'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${TAG}"
            echo '```'
            echo ""
            echo "All tags and image history on the [GHCR package page](${PKG_URL})."
          } >> NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file NOTES.md --verify-tag
