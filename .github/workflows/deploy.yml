name: Build and deploy memegen-rs

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # tenequm/memegen-rs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # The template corpus is not committed to the repo. Assemble it into
      # ./templates here (your VLM markup pipeline) before the image build.
      # - run: ./scripts/assemble-templates.sh

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build linux/amd64 once and push to GHCR. (push + load together is
      # rejected by the buildx driver, so we pull the image back for the CF
      # step below instead of loading it here.)
      - name: Build and push to GHCR
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./ops/docker/Containerfile
          platforms: linux/amd64 # Cloudflare Containers requirement
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: actions/setup-node@v6

      - name: Install Worker deps
        working-directory: ops/worker
        run: npm ci

      # Cloudflare Containers cannot pull from GHCR. Pull the image we just
      # built (by digest) and copy it into Cloudflare's managed registry (which
      # forbids the 'latest' tag, so we use a commit-derived tag).
      - name: Copy image to Cloudflare registry
        working-directory: ops/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SRC="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          TAG="g${{ github.sha }}"
          docker pull "$SRC"
          docker tag "$SRC" "memegen-rs:${TAG}"
          npx wrangler containers push "memegen-rs:${TAG}"

      # Point wrangler at the pre-built CF registry image instead of rebuilding.
      - name: Pin image reference for deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          IMG="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/memegen-rs:g${{ github.sha }}"
          sed -i "s|\"image\": \"../docker/Containerfile\"|\"image\": \"${IMG}\"|" ops/worker/wrangler.jsonc

      # Guards the /__purge route in worker.ts.
      - name: Set purge secret
        working-directory: ops/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PURGE_SECRET: ${{ secrets.PURGE_SECRET }}
        run: printf '%s' "$PURGE_SECRET" | npx wrangler secret put PURGE_SECRET

      - name: Deploy Worker + Container
        working-directory: ops/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Replace the active container instance in one step instead of a gradual
        # rollout (otherwise a warm instance can serve the old image for minutes).
        run: npx wrangler deploy --containers-rollout=immediate

      # Wait for the fresh container, then purge so no entry cached from the old
      # image during rollout survives (images are served `immutable`).
      - name: Purge Workers Cache after rollout
        env:
          PURGE_SECRET: ${{ secrets.PURGE_SECRET }}
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://memegen.rs/?cb=${RANDOM}${i}" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          sleep 20
          curl -fsS -X POST -H "x-purge-secret: $PURGE_SECRET" "https://memegen.rs/__purge"
